services:
  strands-service:
    build:
      context: ./server/strands_agents
      dockerfile: Dockerfile.strands
    env_file:
      - ./server/.env
    environment:
      - AGENTCORE_ENVIRONMENT=development
    # NO ports: published here — strands is internal-only.
    # The gateway reaches it via Docker DNS: http://strands-service:8001
    # Exposing port 8001 to the host would allow unauthenticated public access
    # to all AI agent endpoints. Keep this block absent in production too.
    volumes:
      - ./server/syllabi:/app/syllabi
      - ./server/quizzes:/app/quizzes

  gateway:
    build:
      context: ./server
      dockerfile: Dockerfile.gateway
    ports:
      - "5001:3001"
    depends_on:
      - strands-service
    env_file:
      - .env
    environment:
      # Instruct the Node.js gateway to route to the Python container via Docker DNS
      - STRANDS_URL=http://strands-service:8001
    volumes:
      # NOTE: In production, replace this with a Docker secret or
      # FIREBASE_SERVICE_ACCOUNT_JSON env var to avoid mounting key files.
      - ./server/serviceAccountKey.json:/app/serviceAccountKey.json:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # For local testing, we point the frontend to the local machine's exposed port 5001
        - VITE_API_URL=http://localhost:5001
    ports:
      - "80:80"
    depends_on:
      - gateway
