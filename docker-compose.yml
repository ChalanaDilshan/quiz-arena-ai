services:
  strands-service:
    build:
      context: ./server/strands_agents
      dockerfile: Dockerfile.strands
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./server/.env
    environment:
      - AGENTCORE_ENVIRONMENT=development
    # NO ports published here — strands is internal-only.
    # The gateway reaches it via Docker DNS: http://strands-service:8001
    # Exposing port 8001 to the host would allow unauthenticated public access
    # to all AI agent endpoints.
    volumes:
      - ./server/syllabi:/app/syllabi
      - ./server/quizzes:/app/quizzes
    networks:
      - quiz-arena-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    build:
      context: ./server
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "5001:3001"
    depends_on:
      strands-service:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Instruct the Node.js gateway to route to the Python container via Docker DNS
      - STRANDS_URL=http://strands-service:8001
    volumes:
      # NOTE: In production, replace this with a Docker secret or
      # FIREBASE_SERVICE_ACCOUNT_JSON env var to avoid mounting key files.
      - ./server/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    networks:
      - quiz-arena-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Build-time configuration forwarded from environment / .env
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5001}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - quiz-arena-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  quiz-arena-network:
    driver: bridge

